name: CI/CD Pipeline

on: [push, pull_request]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test -- --reporter=verbose --reporter=junit --outputFile=../../test-results-unit.xml --coverage --coverage.reporter=lcov

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-node${{ matrix.node-version }}
          path: |
            frontend/coverage/
            test-results-unit.xml
          retention-days: 30

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports-node${{ matrix.node-version }}
          path: |
            frontend/test-results/
            frontend/blob-report/
          retention-days: 30
